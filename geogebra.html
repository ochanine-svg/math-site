  line-height: 1.6;
  overflow-wrap: break-word;

  width: 100%;
  border: none;
  border-radius: 10px;
}

  height: 20px;
}

<body>

<h1>GeoGebra Visualization</h1>

<div class="card">
  <p>
    r is the ratio outflow rate divided by inflow rate. r &gt; 1 means more fluid is flowing out than flowing in.
    C₀ is the initial salt concentration. c is the incoming salt concentration.
    s is the ratio of the maximum volume capacity to the initial volume.
  </p>
</div>

<div class="card">
  <iframe src="YOUR_GGB_LINK" height="500"></iframe>
</div>

<div class="card">
