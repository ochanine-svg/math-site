<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
body {
  max-width: 900px;
  margin: auto;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

h1 {
  text-align: center;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

iframe {
  width: 100%;
  height: 500px;
  border: none;
  border-radius: 10px;
}
</style>

<title>GeoGebra Model</title>
</head>

<body>

<h1>GeoGebra Visualization</h1>

<div class="card">
  <p>
    r is the ratio outflow rate divided by inflow rate. r &gt; 1 means more fluid is flowing out than flowing in.
    C₀ is the initial salt concentration. c is the incoming salt concentration.
    s is the ratio of max volume capacity to initial volume.
  </p>
</div>

<div class="card">
  <iframe
    src="https://www.geogebra.org/material/iframe/id/ujpbw8cx/width/900/height/500"
    allowfullscreen>
  </iframe>
</div>

</body>
</html>
